<!DOCTYPE html>
<html>

<head>

  <meta charset="utf-8">
  <title>Émilie's Birthday Garden</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0>
  <link rel="stylesheet" href="css/fullscreenp5.css">

  <!-- Linking to the main p5.js library, which allows your code to use all of the p5 functions that we have learned. Using this version while developing your code allows p5 to provide more Friendly Error Messages when you mess something up...-->
  <script src="js/p5.js"></script>

  <!-- Once your project is working completely, you can comment out the link to p5.js above, and instead link to this minified version. The minified version takes less space, and turns off Friendly Error Messages. This increases the speed of your program quite dramatically in some cases. -->
  <!-- <script src="js/p5.min.js"></script> -->

  <!-- link p5.play.js -->
  <script src="js/p5.play.js"></script>

  <!-- If you are going to use sound in your project, uncomment the line below this... -->
  <script src="js/p5.sound.min.js"></script>

  <!-- If you are going to use the collision detection library in your project, uncomment the line below this... -->
  <!-- <script src="js/p5.collide2d.min.js"></script> -->


  <!-- Link to the JS file you are writing your program in. If you are writing a very large project, you can split these up into multiple files and link to all of them here. -->

  <script src="sketch.js"></script>
  <script src="item-storage.js"></script>
  <script src="messages.js"></script>
  <script src="grid.js"></script>
  <script src="island.js"></script>
  <script src="player.js"></script>
  <script src="catch.js"></script>
  <script src="villagers.js"></script>
  <script src="function.js"></script>
  <script src="birthday.js"></script>

</head>

<body>
  <div id="p5_loading" class="loadingclass">
    <h1>Loading...</h1>
  </div>

  <!-- Birthday garden quest UI -->
  <div id="birthdayHud" class="birthday-hud birthday-hidden">
    <div class="birthday-hud-top">
      <div id="birthdayTitle" class="birthday-title">エミリーの誕生日ガーデン</div>
      <button id="birthdayLang" class="birthday-lang" type="button">English</button>
    </div>
    <div id="birthdayProgress" class="birthday-progress">タネ 0/6 ・ 植えた 0/6 ・ 咲いた 0/6</div>
    <div id="birthdayHint" class="birthday-hint">光る場所をクリックで掘る / 畑をクリックで植える・水やり</div>
  </div>

  <div id="birthdayToast" class="birthday-toast"></div>

  <div id="birthdayModal" class="birthday-modal">
    <div class="birthday-letter">
      <div class="birthday-letter-gift">🎁🌸</div>
      <h2 id="birthdayLetterTitle">Happy Birthday, Émilie! 🌸</h2>
      <p id="birthdayLetterBody"></p>
      <div class="birthday-gift-gallery">
        <figure class="birthday-gift-card">
          <img id="birthdayGiftPouchImg" src="assets/birthday/gifts/pouch.jpeg" alt="Pouch">
          <figcaption id="birthdayGiftPouch">ポーチ</figcaption>
        </figure>
        <figure class="birthday-gift-card">
          <img id="birthdayGiftTopImg" src="assets/birthday/gifts/top.jpeg" alt="A new top">
          <figcaption id="birthdayGiftTop">新しいトップス</figcaption>
        </figure>
        <figure class="birthday-gift-card">
          <img id="birthdayGiftCosmeticsImg" src="assets/birthday/gifts/cosmetics.jpeg" alt="Some cosmetics">
          <figcaption id="birthdayGiftCosmetics">コスメ</figcaption>
        </figure>
      </div>
      <p id="birthdayLetterOutro"></p>
      <div class="birthday-letter-actions">
        <button id="birthdayLetterLang" class="birthday-letter-lang" type="button">English</button>
        <button id="birthdayClose" class="birthday-close" type="button">閉じる</button>
      </div>
    </div>
  </div>
</body>

</html>
